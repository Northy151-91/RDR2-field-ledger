<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2b1c15"><meta name="apple-mobile-web-app-capable" content="yes">
<title>RDR2 Crafting Tracker</title><link rel="manifest" href="manifest.webmanifest">

<style>
:root{
--bg:#d7c39b;--card:#efe1c3;--card2:#e2cfaa;--line:#8a7051;--text:#32261b;--muted:#6d5a45;
--accent:#a77a42;--accent2:#7d493b;--good:#667c58;--bad:#9a574a;--input:#f6ead2;--leather:#5a4332
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;background:linear-gradient(#e9dab9,#d7c39b);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding-bottom:calc(118px + env(safe-area-inset-bottom));min-height:100vh}
header{position:sticky;top:0;z-index:25;background:linear-gradient(180deg,#624a38,#4d382b);padding:calc(10px + env(safe-area-inset-top)) 12px 10px;border-bottom:1px solid #8b735b}
.header-row{display:flex;align-items:center;gap:10px;margin-bottom:8px}
h1{font:700 19px Georgia,serif;color:#f6ead1;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.search{width:100%;height:44px;border:1px solid #8e755a;background:#f7ecd7;color:#302419;border-radius:12px;padding:0 14px;font-size:16px;outline:none}
main{padding:10px 10px 0;max-width:760px;margin:auto;scroll-padding-bottom:calc(150px + env(safe-area-inset-bottom))}.view{display:none}.view.active{display:block}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.card,.row{background:linear-gradient(180deg,#f0e3c8,#e7d5b4);border:1px solid var(--line);border-radius:14px;box-shadow:0 2px 6px #5c40231a}
.card{padding:13px}.row{padding:12px}.row.done{opacity:.67}
.metric{cursor:pointer;min-height:105px;display:flex;flex-direction:column;justify-content:center}
.metric strong{font-size:26px;display:block;color:#704b2f}.metric span{color:var(--muted);font-size:12px;line-height:1.25}
.progress{height:7px;background:#c5ae85;border-radius:8px;overflow:hidden;margin-top:8px}.progress i{height:100%;display:block;background:var(--good)}
.section-title{display:flex;align-items:center;justify-content:space-between;margin:14px 2px 8px}.section-title h2{font:700 18px Georgia,serif;margin:0}
.filters{display:flex;gap:7px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}.filters::-webkit-scrollbar{display:none}
button,.chip,select{min-height:44px;border:1px solid var(--line);background:#e3d0ad;color:var(--text);border-radius:12px;padding:9px 12px;font-size:14px;font-weight:600}
button:active,.chip:active{transform:scale(.98)}
button.active{background:var(--accent2);border-color:var(--accent2);color:#fff8e9}
.list{display:flex;flex-direction:column;gap:8px}.row-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.row h3{font-size:15px;margin:0 0 5px;line-height:1.3}.sub{font-size:13px;color:var(--muted);line-height:1.4;white-space:pre-line}
.check{width:34px;height:34px;min-width:34px;border-radius:9px;border:1px solid #82684d;background:#d7c29f;display:grid;place-items:center;font-weight:800}
.done .check{background:var(--good);border-color:var(--good);color:white}
.qty{display:grid;grid-template-columns:48px 54px 48px 1fr;align-items:center;gap:8px;margin-top:10px}
.qty button{width:48px;height:44px;padding:0;border-radius:10px;font-size:22px}.qty b{text-align:center;font-size:16px}.pill{font-size:11px;color:var(--muted)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap}.toolbar>*{flex:1 1 130px}.note{font-size:12px;color:var(--muted);margin:7px 2px 10px;line-height:1.4}
.selector{display:grid;grid-template-columns:1fr;gap:8px;margin-bottom:10px}.selector select{width:100%;height:46px;border-radius:11px;background:var(--input)}
.addbtn{width:100%;border-radius:11px;background:var(--accent2);color:white;font-weight:800;margin-bottom:12px}
.badge{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.25px;text-transform:uppercase;border:1px solid #9c7d59;border-radius:999px;padding:3px 7px;margin:3px 4px 0 0;background:#e8d4ae;color:#5b402b}
.star{min-height:40px;min-width:40px;font-size:23px;color:#96714a;background:transparent;border:0;padding:0}.star.on{color:#a8532f}
.hero{background:linear-gradient(135deg,#70533d,#8d6c4b);color:#f7ead0;border:1px solid #927357;border-radius:15px;padding:14px;margin-bottom:10px}
.hero h2{font:700 21px Georgia,serif;margin:0 0 4px}.grouphead{font:700 16px Georgia,serif;color:#5a3c29;margin:15px 3px 6px}
.animal-card{cursor:pointer}.smalllink{display:inline-block;margin-top:9px;color:#693b31;font-weight:700;text-decoration:none}
.mapframe{width:100%;height:52vh;border:1px solid var(--line);border-radius:14px;background:#d5c19d}

/* full-screen mobile sheets */
.modal-backdrop{position:fixed;inset:0;background:#2c2116a8;z-index:80;display:none;align-items:flex-end;justify-content:center}
.modal-backdrop.open{display:flex}.modal{width:100%;max-width:760px;height:min(86vh,760px);overflow:auto;background:#ead9ba;border:1px solid var(--line);border-radius:20px 20px 0 0;padding:14px 12px calc(18px + env(safe-area-inset-bottom))}
.modal-head{position:sticky;top:-14px;z-index:2;background:#ead9ba;padding:8px 0 10px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;border-bottom:1px solid #b79b74}
.modal-head h2{font:700 19px Georgia,serif;margin:0}.modal-close{width:44px;height:44px;padding:0;border-radius:11px;font-size:24px}
.craft-detail,.material-line{background:#f0e3c7;border:1px solid var(--line);border-radius:12px;padding:11px;margin-bottom:8px}
.craft-detail.done{border-color:var(--good);opacity:.72}.craft-detail .status{font-size:11px;border-radius:999px;padding:4px 7px;display:inline-block;margin-top:6px}
.craft-detail.done .status{background:var(--good);color:white}.craft-detail:not(.done) .status{background:#925446;color:white}
.category-label{font-size:12px;font-weight:800;color:#644530;margin:14px 2px 7px;text-transform:uppercase;letter-spacing:.5px}
.material-line h3{font-size:14px;margin:0 0 8px}.unit-checks{display:flex;gap:8px;flex-wrap:wrap}
.unit-check{width:42px;height:42px;border-radius:10px;border:1px solid #80654a;background:#d8c3a0;display:grid;place-items:center;font-weight:800;cursor:pointer}
.unit-check.got{background:var(--good);border-color:var(--good);color:white}.craft-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}

/* primary bottom nav: four large thumb targets */
nav{position:fixed;bottom:0;left:0;right:0;z-index:35;background:#574132f2;border-top:1px solid #7d6654;display:grid;grid-template-columns:repeat(4,1fr);padding:6px 6px calc(6px + env(safe-area-inset-bottom));backdrop-filter:blur(12px)}
nav button{border:0;background:transparent;border-radius:10px;min-height:56px;padding:5px 2px;font-size:11px;color:#dcc9aa}
nav button.active{color:#fff2d7;background:#795741}nav b{display:block;font-size:20px;margin-bottom:1px}

/* More screen launcher tiles */
.launch-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.launch{min-height:92px;text-align:left;padding:13px}.launch b{display:block;font:700 17px Georgia,serif;margin-bottom:4px}
.compact-row{padding:10px}

.statbox{margin-top:10px;padding-top:9px;border-top:1px solid #b79b74}
.statgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}
.stat{background:#e6d4b2;border:1px solid #b99b74;border-radius:10px;padding:8px}
.stat b{display:block;font-size:12px;color:#5a412f;margin-bottom:5px}
.statbar{height:7px;background:#c4ad87;border-radius:999px;overflow:hidden}
.statbar i{display:block;height:100%;background:#6f7d59}
.statval{font-size:11px;color:#6a5744;margin-top:4px}
.horse-section{font:700 15px Georgia,serif;margin:12px 0 6px;color:#5a3c29}


#bottomSpacer{
  display:block;
  width:100%;
  height:calc(150px + env(safe-area-inset-bottom));
  pointer-events:none;
}
body{
  scroll-padding-bottom:calc(150px + env(safe-area-inset-bottom));
}
.view{
  padding-bottom:8px;
}

@media(min-width:600px){#bottomSpacer{height:110px}
 .selector{grid-template-columns:1fr 1fr}.grid{grid-template-columns:repeat(4,1fr)}
 nav{left:50%;right:auto;transform:translateX(-50%);width:min(760px,100%)}
 .modal{height:auto;max-height:82vh}.launch-grid{grid-template-columns:repeat(3,1fr)}
}
</style></head>

</div>

    <div id="modalBody"></div>
  </div>
</div>

const KEY="rdr2-crafting-tracker-v8";
let state=JSON.parse(localStorage.getItem(KEY)||'{}'); state.have=state.have||{}; state.done=state.done||{}; state.learned=state.learned||{}; state.hunt=state.hunt||{}; state.fav=state.fav||{};
let current="dashboard", craftTab="trapper", recipeTab="ALL", statusFilter="ALL", query="", huntAnimal="beaver", huntSource="ALL", trapperSet="ALL", progressFilter="ALL", selectedAnimal="";
const $=s=>document.querySelector(s), save=()=>localStorage.setItem(KEY,JSON.stringify(state));
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
const key=(type,name)=>type+"|"+name; const matches=(...p)=>!query||p.join(" ").toLowerCase().includes(query);
function pct(a,b){return b?Math.round(a/b*100):0} function itemDone(t,n){return !!state.done[key(t,n)]} function toggleDone(t,n){state.done[key(t,n)]=!itemDone(t,n);save();render()}
function learned(n){return !!state.learned[n]} function toggleLearned(n){state.learned[n]=!learned(n);save();render()}
function qty(name,delta){state.have[name]=Math.max(0,(state.have[name]||0)+delta);save();render()}
function metric(t,d,tot,action=""){return `<div class="card metric" ${action?`onclick="${action}"`:``}><strong>${d}/${tot}</strong><span>${esc(t)}</span><div class="progress"><i style="width:${pct(d,tot)}%"></i></div></div>`}

function materialRow(m){
 let have=state.have[m.name]||0,left=Math.max(0,m.need-have),done=left===0;
 return `<div class="row ${done?'done':''}"><div class="row-top"><div><h3>${esc(m.name)}</h3><div class="sub">Need ${m.need} · Left ${left}</div></div><span class="check">${done?'✓':''}</span></div><div class="qty"><button onclick="qty('${esc(m.name).replace(/'/g,"\\'")}',-1)">−</button><b>${have}</b><button onclick="qty('${esc(m.name).replace(/'/g,"\\'")}',1)">+</button><span class="pill">Have</span></div></div>`;
}


function goTo(view,subtab=""){
  current=view;
  if(view==="crafts" && subtab) craftTab=subtab;
  if(view==="recipes" && subtab) recipeTab=subtab;
  document.querySelectorAll(".view").forEach(v=>v.classList.toggle("active",v.id===current));
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("active",b.dataset.view===current));
  window.scrollTo(0,0);
  render();
}

function getMaterialUses(name){
  const out=[];
  const add=(source,label,items)=>{
    items.forEach(x=>{
      const req=String(x.requirements||"");
      if(req.toLowerCase().includes(name.toLowerCase())){
        out.push({source,label,name:x.name,requirements:req,benefit:x.benefit||""});
      }
    });
  };
  add("trapper","Trapper",DATA.trapper);
  add("camp","Camp",DATA.camp);
  add("perk","Talismans & Trinkets",DATA.talismans);
  return out;
}
function showMaterialModal(name){
  const uses=getMaterialUses(name);
  const have=state.have[name]||0;
  const target=state.hunt[name]||0;
  $("#modalTitle").textContent=name;
  $("#modalSummary").textContent=`Hunt target ${target} · Have ${have} · Left ${Math.max(0,target-have)}`;
  const grouped={};
  uses.forEach(u=>(grouped[u.label]=grouped[u.label]||[]).push(u));
  let body="";
  Object.entries(grouped).forEach(([label,items])=>{
    body+=`<div class="category-label">${esc(label)}</div>`;
    body+=items.map(u=>{

  if(!body) body='<div class="card">No linked craft found for this material.</div>';

}

function parseReqText(req){
  return String(req||"").split(/\n|•/).map(s=>s.trim()).map(line=>{
    let m=line.match(/^(\d+)\s*[×x]\s*(.+)$/);
    return m?{qty:parseInt(m[1]),name:m[2].trim()}:null;
  }).filter(Boolean);
}
function craftMaterialKey(type,itemName,materialName,idx){
  return `${type}|${itemName}|${materialName}|${idx}`;
}
function isUnitGot(type,itemName,materialName,idx){
  return !!state.done[craftMaterialKey(type,itemName,materialName,idx)];
}
function toggleCraftMaterial(type,itemName,materialName,idx){
  const k=craftMaterialKey(type,itemName,materialName,idx);
  state.done[k]=!state.done[k];
  // Recalculate global have for this material from all checked craft-material units,
  // but never reduce a manually higher value already present.
  let checked=0;
  Object.entries(state.done).forEach(([dk,val])=>{
    if(val && dk.includes(`|${materialName}|`)) checked++;
  });
  state.have[materialName]=Math.max(state.have[materialName]||0, checked);
  save();
  showCraftModal(type,itemName);
  render();
}
function findCraft(type,name){
  const arr=type==="trapper"?DATA.trapper:type==="camp"?DATA.camp:DATA.talismans;
  return arr.find(x=>x.name===name);
}
function showCraftModal(type,name){
  const x=findCraft(type,name); if(!x)return;
  const reqs=parseReqText(x.requirements);
  $("#craftModalTitle").textContent=x.name;
  $("#craftModalSub").textContent=(type==="trapper"?"Trapper":type==="camp"?"Camp":"Talismans & Trinkets")+(x.benefit?" · "+x.benefit:"");
  let body=reqs.map(r=>{
    let units="";
    for(let i=0;i<r.qty;i++){
      const got=isUnitGot(type,x.name,r.name,i);
      units+=`<span class="unit-check ${got?'got':''}" onclick="toggleCraftMaterial('${type}','${esc(x.name).replace(/'/g,"\\'")}','${esc(r.name).replace(/'/g,"\\'")}',${i})">${got?'✓':i+1}</span>`;
    }
    return `<div class="material-line"><h3>${r.qty} × ${esc(r.name)}</h3><div class="unit-checks">${units}</div></div>`;
  }).join("");
  if(!body) body=`<div class="card"><div class="sub">${esc(x.requirements||"No material checklist available.")}</div></div>`;
  const done=itemDone(type,x.name);
  body+=`<div class="craft-actions"><button class="${done?'active':''}" onclick="toggleDone('${type}','${esc(x.name).replace(/'/g,"\\'")}');showCraftModal('${type}','${esc(x.name).replace(/'/g,"\\'")}')">${done?'✓ Craft Complete':'Mark Craft Complete'}</button></div>`;
  $("#craftModalBody").innerHTML=body;
  $("#craftModal").classList.add("open");
}
function closeCraftModal(){ $("#craftModal").classList.remove("open"); }

  </div>
  <div class="card" style="margin-top:8px"><span class="badge">Perfect pelt</span><div class="sub" style="margin-top:7px">Study the animal and preserve a 3-star specimen with a clean kill. Confirm weapon choice in the in-game Compendium.</div></div>
  ${Object.entries(groups).map(([source,items])=>`<div class="grouphead">${source==="trapper"?"Trapper":source==="camp"?"Camp / Pearson":"Talismans & Trinkets"}</div><div class="list">${items.map(u=>`<div class="row compact-row ${itemDone(u.source,u.item)?'done':''}"><div class="row-top"><div><h3>${esc(u.item)}</h3><div class="sub">${u.qty} × ${esc(u.ingredient)}</div></div><span class="check">${itemDone(u.source,u.item)?'✓':''}</span></div></div>`).join("")}</div>`).join("")}`;
 }else{
  $("#animals").innerHTML=`<div class="section-title"><h2>Animal Guide</h2></div><div class="note">Each entry now includes practical habitat, behaviour, bait and spawn-reset advice.</div><div class="list">${animals.map(a=>{const loc=ANIMAL_LOCATIONS[a]||{};return `<div class="row animal-card" onclick="selectedAnimal='${a}';render()"><div class="row-top"><div><h3>${esc(a.replace(/\b\w/g,c=>c.toUpperCase()))}</h3><div class="sub">${esc(loc.best||"")}<br>${esc(loc.time||"")} · ${esc(loc.habitat||"")}</div></div><span class="check">›</span></div></div>`}).join("")}</div>`;
 }
}

function horseStatsHtml(h){
 if(!h.stats) return `<div class="statbox"><div class="horse-section">Base stats</div><div class="sub">Stats vary by coat for this generic breed entry.</div></div>`;
 const s=h.stats;
 const bar=(label,val)=>`<div class="stat"><b>${label}</b><div class="statbar"><i style="width:${Math.min(100,val*10)}%"></i></div><div class="statval">${val}/10</div></div>`;
 return `<div class="statbox"><div class="horse-section">Base stats</div><div class="statgrid">
 ${bar("Health",s.health)}${bar("Stamina",s.stamina)}${bar("Speed",s.speed)}${bar("Acceleration",s.accel)}
 </div><div class="sub" style="margin-top:7px"><b>Handling:</b> ${esc(s.handling)}</div></div>`;
}

function renderHorses(){
 const wild=HORSES.filter(h=>h.type!=="Stable only"&&h.type!=="Stable purchase");
 const buy=HORSES.filter(h=>h.type==="Stable only"||h.type==="Stable purchase");
 const renderHorse=h=>`<div class="row"><div class="row-top"><div style="flex:1"><h3>${esc(h.name)}</h3>
 <span class="badge">${esc(h.type)}</span><span class="badge">${esc(h.progression)}</span>${h.price?`<span class="badge">${esc(h.price)}</span>`:""}
 <div class="grouphead" style="margin:9px 0 4px">${h.type.includes("Stable")?"Where to buy":"Best spawn / find location"}</div>
 <div>${esc(h.location)}</div><div class="sub" style="margin-top:4px">${esc(h.region)} · ${esc(h.time)}</div>
 <div class="sub" style="margin-top:7px">${esc(h.note)}</div>${horseStatsHtml(h)}</div>
 <button class="star ${isFav("horse",h.name)?'on':''}" onclick="toggleFav('horse','${esc(h.name).replace(/'/g,"\\'")}')">★</button></div></div>`;
 $("#horses").innerHTML=`<div class="section-title"><h2>Horse Finder</h2></div>
 <div class="note">Stats shown are base horse stats before bonding, saddles and stirrups. Generic breed entries may vary by coat.</div>
 <div class="grouphead">Wild / findable horses</div><div class="list">${wild.filter(h=>matches(h.name,h.coat,h.type,h.location,h.region,h.time,h.progression,h.note)).map(renderHorse).join("")||'<div class="card">No matching wild/findable horses.</div>'}</div>
 <div class="grouphead">Stable-only / purchasable horses</div><div class="list">${buy.filter(h=>matches(h.name,h.coat,h.type,h.location,h.region,h.time,h.progression,h.note,h.price||"")).map(renderHorse).join("")||'<div class="card">No matching purchasable horses.</div>'}</div>`;
}
function renderCrafts(){
 let source;
 if(craftTab==="trapper"){source=DATA.trapper.filter(x=>matches(x.name,x.requirements)&&progressOk(x));if(trapperSet!=="ALL")source=source.filter(x=>trapperSetFor(x.name)===trapperSet)}
 else if(craftTab==="camp")source=DATA.camp.filter(x=>matches(x.name,x.requirements));
 else source=DATA.talismans.filter(x=>matches(x.name,x.requirements,x.benefit));
 const setNames=["ALL",...Object.keys(TRAPPER_SETS),"Other Trapper Items"];
 $("#crafts").innerHTML=`<div class="section-title"><h2>Craftables</h2></div>
 <div class="filters">${[["trapper","Trapper"],["camp","Camp"],["perk","Talismans"]].map(t=>`<button class="${craftTab===t[0]?'active':''}" onclick="craftTab='${t[0]}';render()">${t[1]}</button>`).join("")}</div>
 ${craftTab==="trapper"?`<div class="selector"><select onchange="trapperSet=this.value;render()">${setNames.map(s=>`<option ${trapperSet===s?'selected':''}>${s}</option>`).join("")}</select><select onchange="progressFilter=this.value;render()">${["ALL","Main Story","Chapter 6+","Epilogue"].map(s=>`<option ${progressFilter===s?'selected':''}>${s}</option>`).join("")}</select></div>`:""}
 <div class="list">${source.map(x=>craftRow(x,craftTab,craftTab==="perk"?esc(x.benefit):"")).join("")||'<div class="card">No matches.</div>'}</div>`;
}
function renderRecipes(){
 const cats=["ALL",...new Set(DATA.recipes.map(x=>x.category))];
 let arr=DATA.recipes.filter(x=>(recipeTab==="ALL"||x.category===recipeTab)&&matches(x.name,x.ingredients,x.category));
 $("#recipes").innerHTML=`<div class="section-title"><h2>Recipe Guide</h2></div>
 <div class="note">Tap a recipe to mark it learned. Recipes remain reusable reference entries.</div>
 <div class="filters">${cats.map(c=>`<button class="${recipeTab===c?'active':''}" onclick="recipeTab='${c}';render()">${c.replace("AMMO & WEAPONS","AMMO")}</button>`).join("")}</div>
 <div class="list">${arr.map(x=>{const l=learned(x.name),f=isFav("recipe",x.name);return `<div class="row ${l?'done':''}"><div class="row-top">
 <div onclick="toggleLearned('${esc(x.name).replace(/'/g,"\\'")}')" style="flex:1"><h3>${esc(x.name)}</h3><span class="badge">${esc(x.category)}</span><div class="sub" style="margin-top:5px">${esc(x.ingredients)}<br>${l?'Learned':'Not learned'}</div></div>
 <button class="star ${f?'on':''}" onclick="toggleFav('recipe','${esc(x.name).replace(/'/g,"\\'")}')">★</button></div></div>`}).join("")||'<div class="card">No matches.</div>'}</div>`;
}
function downloadBackup(){const b=new Blob([JSON.stringify(state,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="rdr2-tracker-backup.json";a.click()}
function importBackup(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{state=JSON.parse(r.result);save();render();alert("Imported");}catch{alert("Invalid file")}};r.readAsText(f)}
function resetAll(){if(confirm("Reset all progress?")){state={have:{},done:{},learned:{},hunt:{},fav:{}};save();render()}}

function copySummary(){
 const td=DATA.trapper.filter(x=>itemDone("trapper",x.name)).length,cd=DATA.camp.filter(x=>itemDone("camp",x.name)).length,pd=DATA.talismans.filter(x=>itemDone("perk",x.name)).length,rd=DATA.recipes.filter(x=>learned(x.name)).length;
 const text=`RDR2 Tracker — Trapper ${td}/${DATA.trapper.length}, Camp ${cd}/${DATA.camp.length}, Perks ${pd}/${DATA.talismans.length}, Recipes learned ${rd}/${DATA.recipes.length}, Active hunt items ${huntRows().length}`;
 navigator.clipboard?.writeText(text).then(()=>alert("Progress summary copied."));
}

function renderMore(){
 $("#more").innerHTML=`<div class="section-title"><h2>Library & Tools</h2></div><div class="launch-grid">
 <button class="launch" onclick="goTo('animals')"><b>Animals</b><span class="sub">Locations, habitat, bait, behaviour and crafts</span></button>
 <button class="launch" onclick="goTo('horses')"><b>Horses</b><span class="sub">Wild breeds and best spawn locations</span></button>
 <button class="launch" onclick="goTo('recipes','ALL')"><b>Recipes</b><span class="sub">Guide and learned tracking</span></button>
  <button class="launch" onclick="showFavourites()"><b>Pinned</b><span class="sub">Saved objectives and references</span></button></div>
 <div class="section-title"><h2>Backup</h2></div><div class="card"><div class="toolbar"><button onclick="downloadBackup()">Export</button><label class="chip">Import<input type="file" hidden onchange="importBackup(event)"></label><button onclick="copySummary()">Copy summary</button><button onclick="resetAll()">Reset</button></div><div class="note">Progress is stored locally on this device/browser.</div></div>
 <div class="section-title"><h2>Reference</h2></div><div class="card"><div class="sub">Animal and horse notes use established Story Mode spawn areas. Spawn RNG still applies, so camp/sleep or leave and return if an animal or herd does not appear.</div></div>`;
}
function render(){document.querySelectorAll(".view").forEach(v=>v.classList.toggle("active",v.id===current));document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("active",b.dataset.view===current));renderDashboard();renderHunt();renderAnimals();renderHorses();renderCrafts();renderRecipes();renderMore()}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{current=b.dataset.view;window.scrollTo(0,0);render()});$("#search").addEventListener("input",e=>{query=e.target.value.trim().toLowerCase();render()});if("serviceWorker"in navigator&&location.protocol.startsWith("http"))navigator.serviceWorker.register("sw.js");render();
</script></body></html>
